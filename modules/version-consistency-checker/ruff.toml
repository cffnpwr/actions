target-version = "py314"
line-length = 88
indent-width = 2

[lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "RUF",
  "SIM",
  "C4",
  "PTH",
  "S",
  "ANN",
  "EM",
  "FBT",
  "ERA",
  "FIX",
  "TD",
]
ignore = [
  "S603", # false positive: fixed command lists are not untrusted input
]

[lint.per-file-ignores]
"tests/*" = [
  "S101", # Use assert in pytest
]

[lint.flake8-bugbear]
extend-immutable-calls = [
  "typer.Option", # Allow default arguments `type.Option()`
]

[format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
