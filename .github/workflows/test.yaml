name: Test
on:
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - modules/**
      - .golangci.yaml
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/**
      - modules/**
      - .golangci.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Test commitlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/actions/commitlint
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

  go-modules:
    name: Lint modules/${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - github-app
          - terraform-r2-backend
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go and golangci-lint
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: go golangci-lint

      - name: Lint
        run: golangci-lint run
