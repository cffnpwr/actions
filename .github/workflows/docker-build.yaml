name: Docker build
on:
  workflow_call:
    inputs:
      image:
        description: Image name without a tag (e.g. ghcr.io/owner/repo/name)
        type: string
        required: true
      context:
        description: Build context path relative to the caller repository root
        type: string
        required: true
      platforms:
        description: |
          JSON array of objects with `platform` and `runner` keys.
          Each platform is built natively on its runner.
        type: string
        default: '[{"platform":"linux/amd64","runner":"ubuntu-26.04"},{"platform":"linux/arm64","runner":"ubuntu-26.04-arm"}]'
      tags:
        description: Tag rules passed to the `tags` input of docker/metadata-action
        type: string
        default: type=ref,event=branch
      push:
        description: |
          Push the image when its content differs from the existing tags.
          The caller job must grant `contents: read` and `packages: write` regardless of this value.
        type: boolean
        default: false
      registry-username:
        description: |
          Username to log in to the registry of `image`.
          Defaults to the actor of the workflow run, which is valid for ghcr.io.
        type: string
        default: ""
      runner:
        description: Runner label to use for the metadata and merge jobs
        type: string
        default: ubuntu-26.04
    secrets:
      REGISTRY_PASSWORD:
        description: |
          Password or token to log in to the registry of `image`.
          Defaults to GITHUB_TOKEN, which is valid for ghcr.io.
        required: false

permissions: {}

jobs:
  metadata:
    name: Resolve image metadata
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
      artifact-prefix: ${{ steps.resolve.outputs.artifact-prefix }}
      registry: ${{ steps.resolve.outputs.registry }}
    steps:
      - name: Generate tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: ${{ inputs.tags }}

      - name: Resolve outputs
        id: resolve
        env:
          IMAGE: ${{ inputs.image }}
          METADATA: ${{ steps.meta.outputs.json }}
          PUSH: ${{ inputs.push }}
        run: |
          tags="$(jq -c '.tags' <<<"$METADATA")"
          if [[ "$PUSH" == "true" && "$tags" == "[]" ]]; then
            echo "::error::No tags were generated for ${IMAGE}"
            exit 1
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          # NOTE: 呼び出し側がイメージごとにこのworkflowを呼び出しても、artifact名がrun内で重複しないようにする
          echo "artifact-prefix=docker-build-$(printf '%s' "$IMAGE" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"

          # NOTE: distribution/referenceと同じ規則で、イメージ名の先頭の要素をregistryとして扱うか判定する
          #       registryを含まないイメージ名とdocker.ioは、login-actionの既定値（Docker Hub）を使うため空にする
          registry=""
          if [[ "$IMAGE" == */* ]]; then
            domain="${IMAGE%%/*}"
            if [[ "$domain" == "localhost" || ( "$domain" == *[.:]* && "$domain" != "docker.io" && "$domain" != "index.docker.io" ) ]]; then
              registry="$domain"
            fi
          fi
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NOTE: ビルドコンテキストを最後に変更したcommitを求めるため、履歴を取得する
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # NOTE: image configのcreatedはSOURCE_DATE_EPOCHで固定されるため、作成日時はimage manifestのannotationで示す
      #       annotationはimage configに含まれないため、作成日時だけが異なるイメージは変更なしと判定する
      - name: Resolve creation time
        id: created
        env:
          CONTEXT: ${{ inputs.context }}
        run: |
          created="$(TZ=UTC0 git log -1 --date=format-local:'%Y-%m-%dT%H:%M:%SZ' --format=%cd -- "$CONTEXT")"
          if [[ -z "$created" ]]; then
            echo "::error::No commit touches ${CONTEXT}"
            exit 1
          fi
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ needs.metadata.outputs.registry }}
          username: ${{ inputs.registry-username || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      # NOTE: pushする前に既存のタグとimage configを比較するため、まずローカルのOCI layoutへ出力する
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # NOTE: commitに依存しない値に固定し、内容が変わらないレイヤーのdigestを保って再pullを避ける
          SOURCE_DATE_EPOCH: "0"
        with:
          context: ${{ inputs.context }}
          platforms: ${{ matrix.platform }}
          annotations: manifest:org.opencontainers.image.created=${{ steps.created.outputs.created }}
          outputs: type=oci,dest=${{ runner.temp }}/oci,tar=false,rewrite-timestamp=true

      # NOTE: provenance attestationはビルドごとに内容が変わるため、indexやmanifestのdigestではなく、
      #       非圧縮のレイヤーのdigestを含むimage configのdigestを比較する
      - name: Compare with existing tags
        id: compare
        if: inputs.push
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ needs.metadata.outputs.tags }}
          PLATFORM: ${{ matrix.platform }}
          LAYOUT: ${{ runner.temp }}/oci
          SOURCES_DIR: ${{ runner.temp }}/sources
        run: |
          blob() { cat "${LAYOUT}/blobs/${1%%:*}/${1#*:}"; }

          top="$(jq -c '.manifests[0]' "${LAYOUT}/index.json")"
          if [[ "$(jq -r '.mediaType' <<<"$top")" == "application/vnd.oci.image.index.v1+json" ]]; then
            manifest_digest="$(blob "$(jq -r '.digest' <<<"$top")" | jq -r '
              [.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")]
              | if length == 1 then .[0].digest else error("expected exactly one image manifest") end
            ')"
          else
            manifest_digest="$(jq -r '.digest' <<<"$top")"
          fi
          config_digest="$(blob "$manifest_digest" | jq -r '.config.digest')"
          platform="$(blob "$config_digest" | jq -c '{os, architecture, variant: (.variant // "")}')"
          echo "Built config digest: ${config_digest}"

          changed=false
          first_raw=""
          first_digest=""
          while IFS= read -r tag; do
            if ! raw="$(docker buildx imagetools inspect --raw "$tag")"; then
              echo "::notice::Could not inspect ${tag}; treating ${PLATFORM} as changed"
              changed=true
              break
            fi
            remote_digest="$(jq -r --argjson p "$platform" '
              [.manifests[]? | select(
                .platform.os == $p.os
                and .platform.architecture == $p.architecture
                and (.platform.variant // "") == $p.variant
              )]
              | .[0].digest // ""
            ' <<<"$raw")"
            remote_config_digest=""
            if [[ -n "$remote_digest" ]]; then
              remote_config_digest="$(docker buildx imagetools inspect --raw "${IMAGE}@${remote_digest}" | jq -r '.config.digest')"
            fi
            echo "Config digest of ${tag}: ${remote_config_digest:-(none)}"
            if [[ "$remote_config_digest" != "$config_digest" ]]; then
              changed=true
              break
            fi
            if [[ -z "$first_digest" ]]; then
              first_raw="$raw"
              first_digest="$remote_digest"
            fi
          done < <(jq -r '.[]' <<<"$TAGS")

          slug="${PLATFORM//\//-}"
          if [[ "$changed" == "false" ]]; then
            # NOTE: 既存のmanifestをattestation manifestとともに再利用し、元のprovenanceを保つ
            mkdir -p "$SOURCES_DIR"
            jq -c --arg d "$first_digest" '
              .manifests[] | select(.digest == $d or .annotations["vnd.docker.reference.digest"] == $d)
            ' <<<"$first_raw" > "${SOURCES_DIR}/${slug}.sources"
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

      - name: Push image
        id: push
        if: inputs.push && steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: ${{ inputs.context }}
          platforms: ${{ matrix.platform }}
          annotations: manifest:org.opencontainers.image.created=${{ steps.created.outputs.created }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true

      - name: Record pushed image
        if: inputs.push && steps.compare.outputs.changed == 'true'
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SLUG: ${{ steps.compare.outputs.slug }}
          SOURCES_DIR: ${{ runner.temp }}/sources
        run: |
          mkdir -p "$SOURCES_DIR"
          echo "${IMAGE}@${DIGEST}" > "${SOURCES_DIR}/${SLUG}.sources"
          touch "${SOURCES_DIR}/${SLUG}.changed"

      - name: Upload sources
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.metadata.outputs.artifact-prefix }}-${{ steps.compare.outputs.slug }}
          path: ${{ runner.temp }}/sources/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge:
    name: Merge manifests
    needs:
      - metadata
      - build
    if: inputs.push
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Download sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/sources
          pattern: ${{ needs.metadata.outputs.artifact-prefix }}-*
          merge-multiple: true

      - name: Check for changes
        id: check
        working-directory: ${{ runner.temp }}/sources
        run: |
          if compgen -G '*.changed' > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No platform has changed; skipping push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ needs.metadata.outputs.registry }}
          username: ${{ inputs.registry-username || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      - name: Create manifest list
        if: steps.check.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/sources
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: |-
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.[]' <<<"$TAGS")
          for file in *.sources; do
            while IFS= read -r source; do
              args+=("$source")
            done < "$file"
          done
          docker buildx imagetools create "${args[@]}"
