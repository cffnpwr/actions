name: Status check
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:
    types:
      - checks_requested
  workflow_call:
    inputs:
      timeout-minutes:
        description: Timeout in minutes for the job
        type: number
        default: 30
      pending-interval:
        description: Polling interval in seconds when checks are pending
        type: number
        default: 15
      error-interval:
        description: Polling interval in seconds when a GitHub API request fails
        type: number
        default: 30
      runner:
        description: Runner label to use for the job
        type: string
        default: ubuntu-24.04

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  status-check:
    name: Status check
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes || 30 }}
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Check out actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: .github/actions/status-check
          persist-credentials: false

      - name: Watch checks
        uses: ./.actions/.github/actions/status-check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          head-sha: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          pending-interval: ${{ inputs.pending-interval || 15 }}
          error-interval: ${{ inputs.error-interval || 30 }}
