name: GitHub Actions Lint
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
  workflow_call:
    inputs:
      runner:
        description: Runner label to use for the job
        type: string
        default: ubuntu-26.04

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Run actionlint
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: |
            mise.toml
            mise.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install actionlint
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: .actions
          install_args: actionlint

      - name: Run actionlint
        run: actionlint -color

  ghalint:
    name: Run ghalint
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: |
            mise.toml
            mise.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install ghalint
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: .actions
          install_args: ghalint

      - name: Run ghalint
        run: ghalint run

  zizmor:
    name: Run zizmor
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: |
            mise.toml
            mise.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install zizmor
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: .actions
          install_args: zizmor

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=regular --collect=default --color=always -- .
