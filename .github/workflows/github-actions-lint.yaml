name: GitHub Actions Lint
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
  workflow_call:
    inputs:
      runner:
        description: Runner label to use for the job
        type: string
        default: ubuntu-24.04

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Run actionlint
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: false

      - name: Run actionlint
        run: |
          version="$(yq -p toml -oy '.tools.actionlint' .actions/mise.toml)"
          mise exec "actionlint@${version}" -- actionlint -color

  ghalint:
    name: Run ghalint
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: false

      - name: Run ghalint
        run: |
          version="$(yq -p toml -oy '.tools.ghalint' .actions/mise.toml)"
          mise exec "ghalint@${version}" -- ghalint run

  zizmor:
    name: Run zizmor
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read tool versions
        id: tools
        run: echo "zizmor=$(yq -p toml -oy '.tools.zizmor' .actions/mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          version: ${{ steps.tools.outputs.zizmor }}
          advanced-security: false
