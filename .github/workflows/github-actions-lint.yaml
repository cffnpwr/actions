name: GitHub Actions Lint
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
  workflow_call:
    inputs:
      runner:
        description: Runner label to use for the job
        type: string
        default: ubuntu-24.04

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Run actionlint
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: false

      - name: Run actionlint
        run: |
          version="$(sed -n 's/^actionlint[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .actions/mise.toml)"
          mise exec "actionlint@${version}" -- actionlint -color

  ghalint:
    name: Run ghalint
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: false

      - name: Run ghalint
        run: |
          version="$(sed -n 's/^ghalint[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .actions/mise.toml)"
          mise exec "ghalint@${version}" -- ghalint run

  zizmor:
    name: Run zizmor
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read tool versions
        id: tools
        run: echo "zizmor=$(sed -n 's/^zizmor[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .actions/mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: ${{ steps.tools.outputs.zizmor }}
          advanced-security: false
