name: commitlint
on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      config-file:
        description: |
          Path to a commitlint config file in the caller repository (relative to repo root).
          When empty, the shared @cffnpwr/commitlint-config is installed and used.
        type: string
        default: ""
      runner:
        description: Runner label to use for the job
        type: string
        default: ubuntu-24.04

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Run commitlint
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Resolve commitlint config
        id: config
        env:
          CONFIG_FILE_INPUT: ${{ inputs.config-file }}
          CONFIG_PACKAGE_VERSION: 1.0.0
          WORKDIR: ${{ runner.temp }}/commitlint
        run: |
          set -euo pipefail
          if [ -n "$CONFIG_FILE_INPUT" ]; then
            if [ ! -f "$CONFIG_FILE_INPUT" ]; then
              echo "::error::config-file '$CONFIG_FILE_INPUT' not found in caller repository"
              exit 1
            fi
            echo "path=$CONFIG_FILE_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$WORKDIR"
          printf '{"name":"commitlint-runner","private":true}\n' > "$WORKDIR/package.json"
          printf 'export default { extends: ["@cffnpwr/commitlint-config"] };\n' > "$WORKDIR/commitlint.config.mjs"
          bun add --cwd "$WORKDIR" "@cffnpwr/commitlint-config@${CONFIG_PACKAGE_VERSION}"
          echo "path=$WORKDIR/commitlint.config.mjs" >> "$GITHUB_OUTPUT"

      - name: Run commitlint
        env:
          COMMITLINT_VERSION: 20.5.3
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONFIG_PATH: ${{ steps.config.outputs.path }}
        run: bunx "@commitlint/cli@${COMMITLINT_VERSION}" --config "$CONFIG_PATH" --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
