name: commitlint
on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      config-file:
        description: |
          Path to a commitlint config file in the caller repository (relative to repo root).
          When empty, the caller's own config is auto-discovered, falling back to
          the bundled @cffnpwr/commitlint-config.
        type: string
        default: ""
      ignore-emails:
        description: |
          Newline-separated author email addresses to exclude from commitlint.
          Defaults to renovate[bot]; pass an empty string to exclude no author.
        type: string
        # Keep in sync with the DEFAULT_IGNORE_EMAILS env below, which covers the
        # direct pull_request runs of this repository (where workflow_call input
        # defaults do not apply).
        default: "29139614+renovate[bot]@users.noreply.github.com"
      runner:
        description: Runner label to use for the job
        type: string
        default: ubuntu-24.04

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Run commitlint
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DEFAULT_IGNORE_EMAILS: "29139614+renovate[bot]@users.noreply.github.com"
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out actions repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: cffnpwr/actions
          ref: ${{ job.workflow_sha }}
          path: .actions
          sparse-checkout: .github/actions/commitlint
          persist-credentials: false

      - name: Run commitlint
        uses: ./.actions/.github/actions/commitlint
        with:
          from: ${{ github.event.pull_request.base.sha }}
          to: ${{ github.event.pull_request.head.sha }}
          # On a direct pull_request run this workflow is the top-level one, so
          # github.workflow_ref equals job.workflow_ref and workflow_call input
          # defaults do not apply; use the env default. On workflow_call the two
          # refs differ, so pass the caller's input through verbatim, letting an
          # empty string opt out of all exclusion.
          ignore-emails: ${{ github.workflow_ref == job.workflow_ref && env.DEFAULT_IGNORE_EMAILS || inputs.ignore-emails }}
          config-file: ${{ inputs.config-file }}
