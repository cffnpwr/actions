name: commitlint
on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      config-file:
        description: |
          Path to a commitlint config file in the caller repository (relative to repo root).
          When empty, the default config bundled in this repository is used. In that case
          the calling job must grant `actions: read` so the bundled config can be checked
          out at the same SHA the caller pinned for this reusable workflow.
        type: string
        default: ""
      runner:
        description: Runner label to use for the job
        type: string
        default: ubuntu-24.04

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Run commitlint
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # github.workflow_ref / github.workflow_sha point to the caller workflow when this is
      # invoked via workflow_call, so they cannot be used to resolve the reusable workflow's
      # own repo/ref. Instead, look up referenced_workflows on the current run, which records
      # the exact SHA the caller pinned for this reusable workflow. Dogfood (pull_request on
      # this repo) is detected by the caller repository matching cffnpwr/actions; in that case
      # the file is already present in the caller checkout.
      - name: Resolve default commitlint config source
        id: source
        if: inputs.config-file == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_REPO: cffnpwr/actions
        run: |
          set -euo pipefail
          if [ "$CALLER_REPO" = "$SOURCE_REPO" ]; then
            {
              echo "checkout=false"
              echo "path=.github/commitlint/default.config.ts"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(gh api "/repos/${CALLER_REPO}/actions/runs/${RUN_ID}" \
            --jq ".referenced_workflows[] | select(.path | startswith(\"${SOURCE_REPO}/\")) | .sha" \
            | head -n1)
          if [ -z "$sha" ]; then
            echo "::error::could not resolve ${SOURCE_REPO} reusable workflow SHA from referenced_workflows. Ensure the calling job grants 'actions: read'."
            exit 1
          fi
          {
            echo "checkout=true"
            echo "sha=$sha"
            echo "path=__commitlint_defaults/.github/commitlint/default.config.ts"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout default commitlint config
        if: inputs.config-file == '' && steps.source.outputs.checkout == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: cffnpwr/actions
          ref: ${{ steps.source.outputs.sha }}
          path: __commitlint_defaults
          sparse-checkout: .github/commitlint
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve commitlint config path
        id: config
        env:
          CONFIG_FILE_INPUT: ${{ inputs.config-file }}
          DEFAULT_CONFIG_PATH: ${{ steps.source.outputs.path }}
        run: |
          if [ -n "$CONFIG_FILE_INPUT" ]; then
            if [ ! -f "$CONFIG_FILE_INPUT" ]; then
              echo "::error::config-file '$CONFIG_FILE_INPUT' not found in caller repository"
              exit 1
            fi
            echo "path=$CONFIG_FILE_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "path=$DEFAULT_CONFIG_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Run commitlint
        env:
          COMMITLINT_VERSION: 20.5.3
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONFIG_PATH: ${{ steps.config.outputs.path }}
        run: bunx "@commitlint/cli@${COMMITLINT_VERSION}" --config "$CONFIG_PATH" --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
