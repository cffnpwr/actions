name: commitlint
description: Run commitlint over a commit range, skipping commits by ignored author emails.
inputs:
  from:
    description: Base SHA (exclusive) of the commit range to lint.
    required: true
  to:
    description: Head SHA (inclusive) of the commit range to lint.
    required: true
  ignore-emails:
    description: |
      Newline-separated author email addresses to exclude from commitlint.
      When empty, no author is excluded.
    required: false
    default: ""
  config-file:
    description: |
      Path to a commitlint config file in the target repository (relative to its
      root). When empty, the repository's own config is auto-discovered, falling
      back to the bundled @cffnpwr/commitlint-config.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        working_directory: ${{ github.action_path }}/../../..
        install_args: bun

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile --production

    - name: Run commitlint
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REPO_PATH: ${{ github.workspace }}
        FROM_SHA: ${{ inputs.from }}
        TO_SHA: ${{ inputs.to }}
        IGNORE_EMAILS: ${{ inputs.ignore-emails }}
        CONFIG_FILE: ${{ inputs.config-file }}
      run: bun run "$GITHUB_ACTION_PATH/src/main.ts"
